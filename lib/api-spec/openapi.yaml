openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RAG Evaluation Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Document management
  - name: question-sets
    description: Question set management
  - name: experiments
    description: Experiment configuration
  - name: eval-runs
    description: Evaluation run management
  - name: dashboard
    description: Dashboard summaries
  - name: sweeps
    description: Parameter sweep management
  - name: leaderboard
    description: Cross-experiment leaderboard
  - name: templates
    description: Reusable experiment configuration templates
  - name: comparison
    description: Side-by-side experiment comparison
  - name: trends
    description: Per-experiment metric trends over time
  - name: human-ratings
    description: Anonymous human ratings of eval-run answers
  - name: presets
    description: Curated document + question set scenarios
  - name: challenge
    description: Daily challenge mode with scoring
  - name: arena
    description: Side-by-side RAG system battles

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all uploaded documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload a new document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentBody"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /question-sets:
    get:
      operationId: listQuestionSets
      tags: [question-sets]
      summary: List all question sets
      responses:
        "200":
          description: List of question sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSet"
    post:
      operationId: createQuestionSet
      tags: [question-sets]
      summary: Create a new question set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionSetBody"
      responses:
        "201":
          description: Question set created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"

  /question-sets/{id}:
    get:
      operationId: getQuestionSet
      tags: [question-sets]
      summary: Get a question set with its questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSetDetail"
    delete:
      operationId: deleteQuestionSet
      tags: [question-sets]
      summary: Delete a question set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /question-sets/{id}/questions:
    post:
      operationId: addQuestion
      tags: [question-sets]
      summary: Add a question to a question set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Question added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /experiments:
    get:
      operationId: listExperiments
      tags: [experiments]
      summary: List all experiments
      responses:
        "200":
          description: List of experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"
    post:
      operationId: createExperiment
      tags: [experiments]
      summary: Create a new experiment configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentBody"
      responses:
        "201":
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"

  /experiments/{id}:
    get:
      operationId: getExperiment
      tags: [experiments]
      summary: Get an experiment with its runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Experiment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetail"
    delete:
      operationId: deleteExperiment
      tags: [experiments]
      summary: Delete an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /experiments/{id}/runs:
    post:
      operationId: createEvalRun
      tags: [eval-runs]
      summary: Trigger a new evaluation run for an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvalRunBody"
      responses:
        "201":
          description: Eval run created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"

  /eval-runs:
    get:
      operationId: listEvalRuns
      tags: [eval-runs]
      summary: List all evaluation runs
      parameters:
        - name: experimentId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of eval runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvalRun"

  /eval-runs/{id}:
    get:
      operationId: getEvalRun
      tags: [eval-runs]
      summary: Get eval run with detailed per-question results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eval run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunDetail"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall dashboard metrics summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /experiments/compare:
    get:
      operationId: compareExperiments
      tags: [comparison]
      summary: Side-by-side comparison of two experiments
      parameters:
        - name: id1
          in: query
          required: true
          schema:
            type: integer
        - name: id2
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comparison result with both experiments + diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentComparison"

  /experiments/{id}/compare:
    get:
      operationId: compareExperimentRuns
      tags: [experiments]
      summary: Per-experiment, per-question comparison of all runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-question metrics across all runs of this experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentRunComparison"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get ranked list of all experiments by performance metrics
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"

  /sweeps:
    get:
      operationId: listSweeps
      tags: [sweeps]
      summary: List all parameter sweeps
      responses:
        "200":
          description: List of sweeps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sweep"
    post:
      operationId: createSweep
      tags: [sweeps]
      summary: Create a parameter sweep generating multiple experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSweepBody"
      responses:
        "201":
          description: Sweep created and experiments launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sweep"

  /sweeps/{id}:
    get:
      operationId: getSweep
      tags: [sweeps]
      summary: Get sweep detail with all generated experiments and their status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sweep detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepDetail"

  /question-sets/{id}/import:
    post:
      operationId: importQuestions
      tags: [question-sets]
      summary: "Bulk import questions from CSV text (columns: text, ground_truth)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportQuestionsBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportQuestionsResult"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all experiment configuration templates (presets + custom)
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a new custom template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateBody"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /templates/{id}:
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /experiments/{id}/trends:
    get:
      operationId: getExperimentTrends
      tags: [trends]
      summary: Per-experiment metric trends across all runs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trends and detected regressions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentTrends"

  /human-ratings:
    get:
      operationId: listHumanRatings
      tags: [human-ratings]
      summary: List ratings for an eval run from the current session
      parameters:
        - name: evalRunId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HumanRating"
    post:
      operationId: createHumanRating
      tags: [human-ratings]
      summary: Upsert a rating for a question in an eval run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHumanRatingBody"
      responses:
        "201":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanRating"

  /eval-runs/{id}/blind:
    get:
      operationId: getBlindEvalRun
      tags: [eval-runs]
      summary: Get per-question content for an eval run without metrics or config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blind eval-run results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlindEvalRun"

  /experiments/{id}/blind:
    patch:
      operationId: setExperimentBlind
      tags: [experiments]
      summary: Toggle blind mode on an experiment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetExperimentBlindBody"
      responses:
        "200":
          description: Updated experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"

  /presets:
    get:
      operationId: listPresets
      tags: [presets]
      summary: List all available preset scenarios
      responses:
        "200":
          description: List of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preset"

  /presets/{slug}:
    get:
      operationId: getPreset
      tags: [presets]
      summary: Get a preset by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"

  /presets/{id}/use:
    post:
      operationId: usePreset
      tags: [presets]
      summary: Start an experiment + eval run using a preset's defaults
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsePresetBody"
      responses:
        "201":
          description: Experiment and eval run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsePresetResponse"

  /challenge/today:
    get:
      operationId: getChallengeToday
      tags: [challenge]
      summary: Get today's challenge preset
      responses:
        "200":
          description: Today's challenge info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeTodayResponse"

  /challenge/today/start:
    post:
      operationId: startChallenge
      tags: [challenge]
      summary: Start today's challenge — creates experiment + eval run
      responses:
        "201":
          description: Challenge attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAttempt"

  /challenge/attempts:
    get:
      operationId: listChallengeAttempts
      tags: [challenge]
      summary: List challenge attempts for the current session
      responses:
        "200":
          description: Challenge attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeAttempt"

  /arena/battles:
    get:
      operationId: listArenaBattles
      tags: [arena]
      summary: List arena battles for the current session
      responses:
        "200":
          description: List of arena battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArenaBattle"
    post:
      operationId: createArenaBattle
      tags: [arena]
      summary: Create a new arena battle between two RAG configurations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArenaBattleBody"
      responses:
        "201":
          description: Arena battle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaBattle"

  /arena/battles/{id}:
    get:
      operationId: getArenaBattle
      tags: [arena]
      summary: Get arena battle detail with both sides + blind results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Arena battle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaBattleDetail"

  /arena/battles/{id}/finalize:
    post:
      operationId: finalizeArenaBattle
      tags: [arena]
      summary: Submit human verdict for an arena battle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeArenaBattleBody"
      responses:
        "200":
          description: Battle finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaBattle"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Document:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        content:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - content
        - sizeBytes
        - createdAt

    CreateDocumentBody:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
      required:
        - name
        - content

    QuestionSet:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        questionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - questionCount
        - createdAt

    QuestionSetDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - questions
        - createdAt

    CreateQuestionSetBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name

    Question:
      type: object
      properties:
        id:
          type: integer
        questionSetId:
          type: integer
        text:
          type: string
        groundTruth:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - questionSetId
        - text
        - createdAt

    CreateQuestionBody:
      type: object
      properties:
        text:
          type: string
        groundTruth:
          type: string
      required:
        - text

    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        embeddingModel:
          type: string
        retrieverType:
          type: string
        topK:
          type: integer
        documentId:
          type: integer
        questionSetId:
          type: integer
        runCount:
          type: integer
        bestFaithfulness:
          type: number
          nullable: true
        bestContextRecall:
          type: number
          nullable: true
        isBlind:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - chunkSize
        - chunkOverlap
        - embeddingModel
        - retrieverType
        - topK
        - documentId
        - questionSetId
        - runCount
        - isBlind
        - createdAt

    ExperimentDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        embeddingModel:
          type: string
        retrieverType:
          type: string
        topK:
          type: integer
        documentId:
          type: integer
        questionSetId:
          type: integer
        isBlind:
          type: boolean
        runCount:
          type: integer
        bestFaithfulness:
          type: number
          nullable: true
        bestContextRecall:
          type: number
          nullable: true
        runs:
          type: array
          items:
            $ref: "#/components/schemas/EvalRun"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - chunkSize
        - chunkOverlap
        - embeddingModel
        - retrieverType
        - topK
        - documentId
        - questionSetId
        - isBlind
        - runCount
        - runs
        - createdAt

    CreateExperimentBody:
      type: object
      properties:
        name:
          type: string
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        embeddingModel:
          type: string
        retrieverType:
          type: string
        topK:
          type: integer
        documentId:
          type: integer
        questionSetId:
          type: integer
      required:
        - name
        - chunkSize
        - chunkOverlap
        - embeddingModel
        - retrieverType
        - topK
        - documentId
        - questionSetId

    EvalRun:
      type: object
      properties:
        id:
          type: integer
        experimentId:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]
        avgFaithfulness:
          type: number
          nullable: true
        avgContextRecall:
          type: number
          nullable: true
        avgLatencyMs:
          type: number
          nullable: true
        totalQuestions:
          type: integer
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - experimentId
        - status
        - createdAt

    CreateEvalRunBody:
      type: object
      properties:
        questionSetId:
          type: integer
          nullable: true
      required: []

    EvalRunDetail:
      type: object
      properties:
        id:
          type: integer
        experimentId:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]
        avgFaithfulness:
          type: number
          nullable: true
        avgContextRecall:
          type: number
          nullable: true
        avgLatencyMs:
          type: number
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/EvalResult"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - experimentId
        - status
        - results
        - createdAt

    EvalResult:
      type: object
      properties:
        id:
          type: integer
        evalRunId:
          type: integer
        questionId:
          type: integer
        questionText:
          type: string
        retrievedContext:
          type: string
          nullable: true
        generatedAnswer:
          type: string
          nullable: true
        faithfulness:
          type: number
          nullable: true
        contextRecall:
          type: number
          nullable: true
        latencyMs:
          type: number
          nullable: true
      required:
        - id
        - evalRunId
        - questionId
        - questionText

    DashboardSummary:
      type: object
      properties:
        totalDocuments:
          type: integer
        totalQuestions:
          type: integer
        totalExperiments:
          type: integer
        totalRuns:
          type: integer
